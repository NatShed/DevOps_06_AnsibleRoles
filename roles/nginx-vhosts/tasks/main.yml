---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: latest
    update_cache: yes

- name: Create root web directory if not exists
  ansible.builtin.file:
    path: /var/www
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Create sites folders
  ansible.builtin.file:
    path: "/var/www/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: "{{ sites }}"

- name: Copy index from template
  ansible.builtin.template:
    src: index.html.j2
    dest: "/var/www/{{ item }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'
  loop: "{{ sites }}"
  notify: restart nginx

- name: Copy nginx config from template
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/conf.d/site-{{ item }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  notify: restart nginx

- name: Remove default nginx site config (if exists)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Ensure nginx is started and enabled
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
